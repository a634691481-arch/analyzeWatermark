<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif;
    background: #ffffff;
    color: #0a0a0b;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 76px 84px;
    position: relative;
  }
  .glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(46rem 26rem at 4% -10%, rgba(16,185,129,0.16), transparent 62%),
      radial-gradient(38rem 24rem at 100% 108%, rgba(59,130,246,0.13), transparent 60%);
  }
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(0,0,0,0.035) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(0,0,0,0.035) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(70% 70% at 50% 45%, #000 30%, transparent 100%);
  }
  .content { position: relative; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    border: 1px solid rgba(16,185,129,0.35);
    background: rgba(16,185,129,0.09);
    color: #047857;
    border-radius: 999px;
    padding: 9px 20px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #10b981; }
  h1 {
    margin-top: 34px;
    font-size: 84px;
    line-height: 1.06;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  h1 .accent { color: #059669; }
  .sub {
    margin-top: 26px;
    font-size: 27px;
    line-height: 1.6;
    color: rgba(10,10,11,0.55);
    max-width: 940px;
  }
  .footer {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .platforms {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .chip {
    border: 1px solid rgba(0,0,0,0.09);
    background: rgba(0,0,0,0.025);
    border-radius: 999px;
    padding: 11px 22px;
    font-size: 22px;
    color: rgba(10,10,11,0.72);
    font-weight: 500;
  }
  .site {
    font-size: 23px;
    font-weight: 700;
    color: rgba(10,10,11,0.34);
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>

  <div class="content">
    <span class="badge"><span class="dot"></span>无水印下载工具</span>
    <h1>一键取回<br><span class="accent">无水印原片</span></h1>
    <p class="sub">粘贴分享链接，自动解析出平台云端保存的未压缩原始文件，不修图、不重编码。</p>
  </div>

  <div class="footer">
    <div class="platforms">
      <span class="chip">豆包</span>
      <span class="chip">抖音</span>
      <span class="chip">小红书</span>
      <span class="chip">千问</span>
      <span class="chip">哔哩哔哩</span>
      <span class="chip">快手</span>
      <span class="chip">微博</span>
    </div>
    <span class="site">qsy.mooon.vip</span>
  </div>
</body>
</html>
